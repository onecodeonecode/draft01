<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Timer</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .timer-container {
      text-align: center;
      background-color: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .time-display {
      font-size: 48px;
      margin: 20px 0;
      color: #38bdf8;
    }
    .controls button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    .controls button:hover {
      background-color: #0ea5e9;
    }
    .inputs input {
      width: 60px;
      padding: 5px;
      margin: 5px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="timer-container">
    <h1>TAPFONE Timer</h1>
    <div class="inputs">
      <input type="number" id="inputHours" placeholder="Hrs." min="0" />
      <input type="number" id="inputMinutes" placeholder="Mins." min="0" />
      <input type="number" id="inputSeconds" placeholder="Secs." min="0" />
    </div>
    <div class="time-display">
      <span id="hours">00</span> :
      <span id="minutes">00</span> :
      <span id="seconds">00</span>
    </div>
    <div class="controls">
      <button onclick="startCountdown()">Start</button>
      <button onclick="pauseCountdown()">Pause</button>
      <button onclick="resetCountdown()">Reset</button>
    </div>
    <audio id="alertSound" src="https://www.soundjay.com/button/beep-07.mp3" preload="auto"></audio>
  </div>

  <script>
    let totalSeconds = 0;
    let countdownInterval = null;

    function updateDisplay() {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;

      document.getElementById('hours').textContent = String(hrs).padStart(2, '0');
      document.getElementById('minutes').textContent = String(mins).padStart(2, '0');
      document.getElementById('seconds').textContent = String(secs).padStart(2, '0');
    }

    function startCountdown() {
      if (countdownInterval) return;

      if (totalSeconds === 0) {
        const hrs = parseInt(document.getElementById('inputHours').value) || 0;
        const mins = parseInt(document.getElementById('inputMinutes').value) || 0;
        const secs = parseInt(document.getElementById('inputSeconds').value) || 0;
        totalSeconds = hrs * 3600 + mins * 60 + secs;
      }

      countdownInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          updateDisplay();
        } else {
          clearInterval(countdownInterval);
          countdownInterval = null;
          document.getElementById('alertSound').play();
        }
      }, 1000);
    }

    function pauseCountdown() {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }

    function resetCountdown() {
      pauseCountdown();
      totalSeconds = 0;
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
