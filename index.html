<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENT</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font and layout for aesthetics and mobile readability */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');
        
        .timer-display {
            font-family: 'Inter', sans-serif;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
        }

        /* Enforce a dark theme background */
        body {
            background-color: #000000; 
        }
    </style>
</head>
<body class="min-h-screen bg-black flex flex-col items-center justify-center text-white p-4">

    <!-- Counter Display Area -->
    <div class="flex flex-col items-center justify-center w-full max-w-lg mx-auto">
        <h1 class="text-4xl font-black mb-6 tracking-wider opacity-80" id="title-text">CENT</h1>
        
        <div id="counter-display" class="timer-display text-9xl md:text-[10rem] font-extrabold text-white text-center select-none" data-value="0">
            0
        </div>
        
        <p id="status-message" class="mt-4 mb-10 text-xl font-medium text-gray-400">Ready to start.</p>
    </div>

    <!-- Controls -->
    <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4 w-full max-w-lg mt-8">
        
        <!-- Start Button (Green) -->
        <button id="start-btn" 
                class="flex-1 px-8 py-4 text-2xl font-bold rounded-xl shadow-lg 
                       bg-green-600 hover:bg-green-700 active:bg-green-800 
                       focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50 
                       transition duration-150 ease-in-out">
            START
        </button>

        <!-- Pause Button (Yellow) -->
        <button id="pause-btn" 
                disabled
                class="flex-1 px-8 py-4 text-2xl font-bold rounded-xl shadow-lg 
                       bg-yellow-600 hover:bg-yellow-700 active:bg-yellow-800 disabled:bg-gray-700 
                       focus:outline-none focus:ring-4 focus:ring-yellow-500 focus:ring-opacity-50 
                       transition duration-150 ease-in-out">
            PAUSE
        </button>

        <!-- Reset Button (Red) -->
        <button id="reset-btn" 
                disabled
                class="flex-1 px-8 py-4 text-2xl font-bold rounded-xl shadow-lg 
                       bg-red-600 hover:bg-red-700 active:bg-red-800 disabled:bg-gray-700 
                       focus:outline-none focus:ring-4 focus:ring-red-500 focus:ring-opacity-50 
                       transition duration-150 ease-in-out">
            RESET
        </button>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center text-white text-sm mt-12 mb-4">
        1Code &copy; 2025
    </footer>

    <script>
        // --- Initialization and Variables ---
        const MAX_COUNT = 100;
        let count = 0;
        let intervalId = null;
        let isRunning = false;
        
        // DOM elements
        const displayEl = document.getElementById('counter-display');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusEl = document.getElementById('status-message');

        // --- Core Timer Functions ---

        /** Updates the count display with a brief animation. */
        function updateDisplay() {
            displayEl.textContent = count;
            // Simple animation: scale up briefly
            displayEl.style.transform = 'scale(1.05)';
            setTimeout(() => {
                displayEl.style.transform = 'scale(1)';
            }, 100); 
        }
        
        /** Enables/disables buttons based on the timer state. */
        function updateButtons() {
            // Start is enabled only if not running AND count is less than max
            startBtn.disabled = isRunning || (count >= MAX_COUNT);
            // Pause is enabled only if running
            pauseBtn.disabled = !isRunning;
            // Reset is enabled only if count is > 0 OR it is running
            resetBtn.disabled = (count === 0 && !isRunning);

            // Update status message
            if (count === MAX_COUNT) {
                statusEl.textContent = `Goal achieved! ${MAX_COUNT} seconds.`;
                statusEl.classList.remove('text-gray-400');
                statusEl.classList.add('text-green-400');
            } else if (isRunning) {
                statusEl.textContent = `Counting...`;
                statusEl.classList.add('text-gray-400');
                statusEl.classList.remove('text-green-400');
            } else if (count > 0) {
                statusEl.textContent = `Paused at ${count}.`;
                statusEl.classList.add('text-gray-400');
                statusEl.classList.remove('text-green-400');
            } else {
                statusEl.textContent = `Ready to start.`;
                statusEl.classList.add('text-gray-400');
                statusEl.classList.remove('text-green-400');
            }
        }

        /** Starts or resumes the counting process. */
        function startTimer() {
            if (isRunning || count >= MAX_COUNT) return;

            isRunning = true;
            updateButtons();

            intervalId = setInterval(() => {
                count++;
                updateDisplay();

                if (count >= MAX_COUNT) {
                    pauseTimer();
                    updateButtons();
                }
            }, 1000); // 1000ms = 1 second
        }

        /** Pauses the counting process. */
        function pauseTimer() {
            if (!isRunning) return;
            
            clearInterval(intervalId);
            intervalId = null;
            isRunning = false;
            updateButtons();
        }

        /** Resets the count to zero. */
        function resetTimer() {
            pauseTimer(); // Ensure interval is stopped
            count = 0;
            updateDisplay();
            updateButtons();
        }

        // --- Event Listeners ---
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Initial setup
        window.onload = () => {
            updateDisplay();
            updateButtons();
        };

    </script>
</body>
</html>
