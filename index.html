<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Ontario Top 50 Best Restaurants</title>
    <!-- Google Fonts & FontAwesome for Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF5A36;
            --primary-dark: #e04825;
            --dark: #1e1e24;
            --light: #f8f9fa;
            --gray: #6c757d;
            --border: #e9ecef;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e1e24 0%, #2c3e50 100%);
            color: white;
            padding: 4rem 1rem 3rem 1rem;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.5px;
        }

        header h1 span {
            color: var(--primary);
        }

        header p {
            font-size: 1.15rem;
            color: #adb5bd;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }

        /* Search & Filter Bar */
        .filter-container {
            max-width: 700px;
            margin: -24px auto 0 auto;
            position: relative;
            padding: 0 1rem;
            z-index: 10;
        }

        .search-bar {
            display: flex;
            background: white;
            border-radius: 50px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .search-bar input {
            flex: 1;
            padding: 1.1rem 1.5rem;
            border: none;
            outline: none;
            font-size: 1rem;
            font-family: inherit;
        }

        .search-bar button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-bar button:hover {
            background: var(--primary-dark);
        }

        /* Main Container */
        .container {
            max-width: 1300px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title span {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--gray);
        }

        /* Grid Layout */
        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        /* Card Design */
        .restaurant-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            position: relative;
        }

        .restaurant-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        .card-img-wrapper {
            position: relative;
            height: 210px;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .restaurant-card:hover .card-img-wrapper img {
            transform: scale(1.06);
        }

        .badge-category {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(30, 30, 36, 0.85);
            backdrop-filter: blur(4px);
            color: white;
            padding: 0.35rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 20px;
            z-index: 2;
        }

        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .restaurant-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
            text-decoration: none;
            transition: var(--transition);
        }

        .restaurant-name:hover {
            color: var(--primary);
        }

        .rating {
            background: #fff8f6;
            color: var(--primary);
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .neighborhood {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .description {
            font-size: 0.92rem;
            color: #495057;
            margin-bottom: 1.25rem;
            flex: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .map-link {
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }

        .map-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: var(--dark);
            color: #adb5bd;
            text-align: center;
            padding: 2.5rem 1rem;
            margin-top: 4rem;
            font-size: 0.95rem;
        }

        footer p {
            color: #fff;
            font-weight: 600;
        }

        /* No results message */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--gray);
            font-size: 1.2rem;
            display: none;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.1rem;
            }
            .filter-container {
                margin-top: -20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>London Ontario's
