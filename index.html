<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>50-Year Stock Market Projection</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>

<style>

body{
margin:0;
background:#111;
font-family:Arial,Helvetica,sans-serif;
color:white;
text-align:center;
}

h1{
margin-top:20px;
}

.container{
width:95%;
max-width:1200px;
margin:auto;
}

canvas{
background:#fff;
border-radius:12px;
margin-top:20px;
}

button{

padding:12px 22px;
margin:15px 8px;
font-size:16px;
border:none;
border-radius:8px;
cursor:pointer;
background:#2196F3;
color:white;
}

button:hover{
background:#0b7dda;
}

.footer{
margin:20px;
color:#aaa;
}

</style>
</head>

<body>

<h1>50-Year Stock Market Projection</h1>

<div class="container">

<canvas id="marketChart"></canvas>

<br>

<button onclick="resetZoom()">Reset Zoom</button>

<button onclick="downloadChart()">Download PNG</button>

</div>

<div class="footer">
Illustrative scenario based on historical market cycles • Not financial advice
</div>

<script>

const years=[
2026,2027,2028,2029,2030,
2032,2035,2037,2038,
2040,2043,2045,2047,
2048,2050,2052,2055,
2058,2060,2062,2065,
2068,2070,2072,2074,
2076
];

const values=[
100,112,105,85,72,
95,145,132,110,
150,195,240,225,
175,145,185,260,
330,250,220,320,
420,500,455,360,
430
];

const ctx=document.getElementById('marketChart');

const chart=new Chart(ctx,{

type:'line',

data:{
labels:years,

datasets:[{

label:'Projected Market Index',

data:values,

borderColor:'#00cc66',

backgroundColor:'rgba(0,200,100,.15)',

borderWidth:3,

pointRadius:5,

pointHoverRadius:8,

fill:true,

tension:.35

}]

},

options:{

responsive:true,

maintainAspectRatio:true,

interaction:{
mode:'nearest',
intersect:false
},

plugins:{

legend:{
labels:{
color:'black'
}
},

tooltip:{
enabled:true,
callbacks:{
label:function(context){
return " Index: "+context.parsed.y;
}
}
},

zoom:{

pan:{
enabled:true,
mode:'x'
},

zoom:{

wheel:{
enabled:true
},

pinch:{
enabled:true
},

drag:{
enabled:true
},

mode:'x'

}

}

},

scales:{

x:{

title:{
display:true,
text:'Year',
color:'black'
},

ticks:{
color:'black'
}

},

y:{

title:{
display:true,
text:'Market Index',
color:'black'
},

ticks:{
color:'black'
}

}

}

}

});

function resetZoom(){
chart.resetZoom();
}

function downloadChart(){

const link=document.createElement("a");

link.download="50-Year-Stock-Market-Projection.png";

link.href=chart.toBase64Image();

link.click();

}

</script>

</body>
</html>
