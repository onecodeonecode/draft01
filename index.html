<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: #00e5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    #timer {
      font-size: 3rem;
      background: #292943;
      padding: 20px 40px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
      margin-bottom: 30px;
    }
    button {
      background-color: #00e5ff;
      border: none;
      color: #1e1e2f;
      font-size: 1rem;
      font-weight: bold;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #00bcd4;
    }
  </style>
</head>
<body>
  <h1>Timer</h1>
  <div id="timer">00:00:00</div>
  <div>
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
    <button onclick="resetTimer()">Reset</button>
  </div>

  <script>
    let timer;
    let totalSeconds = 0;
    let isRunning = false;

    function updateTimerDisplay() {
      let hours = Math.floor(totalSeconds / 3600);
      let minutes = Math.floor((totalSeconds % 3600) / 60);
      let seconds = totalSeconds % 60;

      document.getElementById("timer").textContent =
        String(hours).padStart(2, '0') + ":" +
        String(minutes).padStart(2, '0') + ":" +
        String(seconds).padStart(2, '0');
    }

    function startTimer() {
      if (!isRunning) {
        timer = setInterval(() => {
          totalSeconds++;
          updateTimerDisplay();
        }, 1000);
        isRunning = true;
      }
    }

    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      totalSeconds = 0;
      updateTimerDisplay();
    }

    // Initialize display
    updateTimerDisplay();
  </script>
</body>
</html>
