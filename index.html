<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Picker AI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #fff;
}
header {
    text-align: center;
    padding: 15px;
    background: #161b22;
    font-size: 20px;
    font-weight: bold;
}
.container {
    padding: 10px;
}
.crypto {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161b22;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}
.name {
    font-weight: bold;
}
.price {
    font-size: 14px;
}
.signal {
    font-weight: bold;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 13px;
}
.buy { background: #1f883d; }
.sell { background: #da3633; }
.hold { background: #1f6feb; }
footer {
    text-align: center;
    font-size: 12px;
    opacity: 0.7;
    padding: 10px;
}
</style>
</head>

<body>

<header>📈 Crypto Picker</header>

<div class="container" id="cryptoList"></div>

<footer>1Code</footer>

<script>
const coins = [
    "btcusdt","ethusdt","bnbusdt","solusdt","xrpusdt",
    "adausdt","dogeusdt","avaxusdt","dotusdt","maticusdt"
];

const priceHistory = {};
const cryptoList = document.getElementById("cryptoList");

coins.forEach(symbol => {
    priceHistory[symbol] = [];
    const div = document.createElement("div");
    div.className = "crypto";
    div.id = symbol;
    div.innerHTML = `
        <div>
            <div class="name">${symbol.toUpperCase().replace("USDT","")}</div>
            <div class="price">$0.00</div>
        </div>
        <div class="signal hold">HOLD</div>
    `;
    cryptoList.appendChild(div);
});

function sma(data, length) {
    if (data.length < length) return null;
    const slice = data.slice(-length);
    return slice.reduce((a,b)=>a+b,0) / length;
}

const ws = new WebSocket(
    "wss://stream.binance.com:9443/stream?streams=" +
    coins.map(c => c + "@trade").join("/")
);

ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    const symbol = msg.data.s;
    const price = parseFloat(msg.data.p);

    const key = symbol.toLowerCase();
    if (!priceHistory[key]) return;

    priceHistory[key].push(price);
    if (priceHistory[key].length > 50) {
        priceHistory[key].shift();
    }

    const sma10 = sma(priceHistory[key], 10);
    const sma30 = sma(priceHistory[key], 30);

    const row = document.getElementById(key);
    row.querySelector(".price").textContent = "$" + price.toFixed(2);

    const signalEl = row.querySelector(".signal");

    if (sma10 && sma30) {
        if (sma10 > sma30) {
            signalEl.textContent = "🟢 BUY";
            signalEl.className = "signal buy";
        } else if (sma10 < sma30) {
            signalEl.textContent = "🔴 SELL";
            signalEl.className = "signal sell";
        } else {
            signalEl.textContent = "🔵 HOLD";
            signalEl.className = "signal hold";
        }
    }
};
</script>

</body>
</html>
