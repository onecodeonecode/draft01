<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How High Are You — Test</title>
  <style>
    :root{
      --bg:#0f1220;
      --card:#151935;
      --track:#28304e;
      --accent:#b2f7b2;  /* light green */
      --accent2:#4de14d; /* medium green */
      --accent3:#0a8f0a; /* dark green */
      --text:#e8ecf3;
      --muted:#b3bdd1;
      --ring: rgba(178,247,178,.25);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:
        radial-gradient(80vmax 80vmax at 10% 10%, #1c2140 0 40%, transparent 41%),
        radial-gradient(60vmax 60vmax at 90% 20%, #191f36 0 40%, transparent 41%),
        linear-gradient(180deg, #0c0f1b, var(--bg));
      color:var(--text);
      font: 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .app{
      width:min(850px, 92vw);
      background:linear-gradient(180deg, #181d3b, var(--card));
      border:1px solid #2a3056;
      border-radius:24px;
      box-shadow: 0 20px 80px rgba(6,10,40,.45), inset 0 1px rgba(255,255,255,.06);
      padding: clamp(18px, 3vw, 28px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      min-height:600px;
    }
    header{display:flex; align-items:center; justify-content:center; gap:16px; text-align:center}
    h1{
      margin:0;
      font-size: clamp(20px, 4vw, 28px);
      letter-spacing:.3px;
      font-weight:700;
    }
    .sub{color:var(--muted); font-size:14px}

    .content{display:flex; flex-direction:column; align-items:center; gap: 22px; margin-top: 18px; flex:1; justify-content:center}

    /* Gauge */
    .gauge-wrap{display:grid; place-items:center; padding: 12px}
    .gauge{
      position:relative;
      width:min(360px, 80vw);
      aspect-ratio:1/1;
      display:grid; place-items:center;
      isolation:isolate;
    }
    svg{width:100%; height:100%; display:block}
    .track{stroke:var(--track); stroke-width:16; fill:none; opacity:.9}
    .progress{stroke: url(#grad); stroke-width:16; fill:none; filter: drop-shadow(0 0 12px rgba(71,179,255,.35));
      transition: stroke-dashoffset .2s linear;
    }

    .ring{ position:absolute; inset:-12px; border-radius:999px; pointer-events:none; box-shadow:0 0 0 0 var(--ring); animation: pulse 2.2s infinite }
    @keyframes pulse{ 0%{box-shadow:0 0 0 0 var(--ring)} 70%{box-shadow:0 0 0 18px rgba(178,247,178,0)} 100%{box-shadow:0 0 0 0 rgba(178,247,178,0)} }

    .center{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding: 18px}
    .label{ font-size: clamp(12px, 2.4vw, 14px); color:var(--muted); letter-spacing:.2px; text-transform:uppercase; }
    .value{ font-weight:800; font-size: clamp(36px, 8vw, 56px); line-height:1; margin-top:6px }
    .state{ font-size: clamp(14px, 3vw, 18px); color:var(--muted); margin-top:8px }

    /* Controls */
    .panel{ background:#11162f; border:1px solid #2a3056; border-radius:16px; padding:16px; margin-top:20px; width:100%; max-width:300px; text-align:center }
    .row{ display:flex; flex-direction:column; gap:12px; align-items:center }
    button{
      -webkit-tap-highlight-color: transparent;
      appearance:none; border:0; cursor:pointer; user-select:none;
      background: linear-gradient(180deg, #2e4830, #1a2c1a);
      color:var(--text); font-weight:700; letter-spacing:.3px;
      border-radius:14px; padding:14px 18px; font-size:18px;
      box-shadow: 0 8px 24px rgba(28,36,80,.45), inset 0 1px rgba(255,255,255,.08);
      transition: transform .08s ease, box-shadow .2s ease, opacity .2s ease;
      width:100%;
    }
    button:hover{ transform: translateY(-1px) }
    button:active{ transform: translateY(0) scale(.99) }
    button:disabled{ opacity:.6; cursor: not-allowed }

    .scale{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; font-size:12px; color:var(--muted); width:100%}
    .tick{ flex:1; height:6px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); border-radius:999px }

    footer{ margin-top:16px; text-align:center; color:var(--muted); font-size:12px }
  </style>
</head>
<body>
  <main class="app" role="main">
    <header>
      <div>
        <h1>How High Are You — Test</h1>
        <div class="sub">Tap START to run a playful meter (for fun only ✌️)</div>
      </div>
    </header>

    <section class="content">
      <div class="gauge-wrap">
        <div class="gauge" aria-label="How High Are You meter">
          <div class="ring" aria-hidden="true"></div>
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="var(--accent)"/>
                <stop offset="50%" stop-color="var(--accent2)"/>
                <stop offset="100%" stop-color="var(--accent3)"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="60" cy="60" r="46" />
            <circle class="progress" cx="60" cy="60" r="46"
                    stroke-linecap="round"
                    stroke-dasharray="289.0265241303"
                    stroke-dashoffset="289.0265241303"
                    transform="rotate(-90 60 60)"/>
          </svg>
          <div class="center">
            <div class="label">How High Are You Test</div>
            <div class="value" id="value">0%</div>
            <div class="state" id="state">Press Start</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <button id="startBtn" type="button">▶ Start</button>
          <div class="scale" aria-hidden="true">
            <span>0</span>
            <div class="tick"></div>
            <span>100</span>
          </div>
        </div>
      </div>
    </section>

    <footer>Just for entertainment — not a real measurement.</footer>
  </main>

  <script>
    (function(){
      const CIRC = 289.0265241303;
      const progress = document.querySelector('.progress');
      const valueEl = document.getElementById('value');
      const stateEl = document.getElementById('state');
      const startBtn = document.getElementById('startBtn');

      const STATES = [
        { max: 10, text: 'Stone-cold Sober' },
        { max: 30, text: 'Barely Buzzed' },
        { max: 55, text: 'Kinda High' },
        { max: 75, text: 'Very High' },
        { max: 90, text: 'Whoa There' },
        { max: 101, text: 'Cloud Nine' }
      ];

      let current = 0;
      let animId = null;

      function setMeter(v){
        v = Math.max(0, Math.min(100, v));
        const dash = CIRC * (1 - v/100);
        progress.style.strokeDashoffset = dash;
        valueEl.textContent = Math.round(v) + '%';
        const s = STATES.find(s => v < s.max) || STATES.at(-1);
        stateEl.textContent = s.text;
        document.documentElement.style.setProperty('--ring', `rgba(0,143,0, ${0.15 + v/100 * 0.25})`);
      }

      function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

      function animateTo(target, ms=1600){
        cancelAnimationFrame(animId);
        const start = performance.now();
        const from = current;
        const delta = target - from;
        function frame(now){
          const t = Math.min(1, (now - start) / ms);
          const eased = easeOutCubic(t);
          current = from + delta * eased;
          setMeter(current);
          if(t < 1){ animId = requestAnimationFrame(frame); }
        }
        animId = requestAnimationFrame(frame);
      }

      function randomTarget(){
        const u = Math.random();
        if(u < .15) return Math.random() * 25;
        if(u < .85) return 30 + Math.random() * 50;
        return 80 + Math.random() * 20;
      }

      setMeter(0);

      startBtn.addEventListener('click', () => {
        startBtn.disabled = true;
        startBtn.textContent = 'Running…';
        stateEl.textContent = 'Calculating vibes…';
        const target = randomTarget();
        animateTo(target, 1800);
        setTimeout(() => {
          startBtn.disabled = false;
          startBtn.textContent = '▶ Start Again';
        }, 1900);
      });
    })();
  </script>
</body>
</html>
