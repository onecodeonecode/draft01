<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>50-Year Stock Market Projection</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:1100px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#bbbbbb;
    margin-bottom:25px;
}

canvas{
    background:#1b1b1b;
    border-radius:15px;
    padding:15px;
}

.controls{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#0b5ed7;
}
</style>

</head>
<body>

<div class="container">

<h1>Illustrative 50-Year Stock Market Projection</h1>

<p>
Educational example based on historical market behavior.
Not a financial prediction or investment advice.
</p>

<canvas id="marketChart"></canvas>

<div class="controls">
<button onclick="resetZoom()">Reset Zoom</button>
</div>

</div>

<script>

const years=[
2026,
2028,
2030,
2032,
2035,
2038,
2041,
2045,
2048,
2051,
2055,
2060,
2064,
2068,
2072,
2076
];

const values=[
100,
118,
132,
101,
150,
185,
135,
225,
270,
175,
310,
395,
285,
470,
620,
540
];

const ctx=document.getElementById("marketChart");

const chart=new Chart(ctx,{
type:"line",

data:{
labels:years,

datasets:[{
label:"Illustrative Market Index",

data:values,

borderColor:"#00ff88",

backgroundColor:"rgba(0,255,136,.15)",

fill:true,

borderWidth:3,

pointRadius:5,

pointHoverRadius:8,

tension:.35
}]
},

options:{

responsive:true,

maintainAspectRatio:false,

plugins:{

legend:{
labels:{
color:"white"
}
},

title:{
display:true,
text:"2026–2076 Example Market Trend",
color:"white",
font:{
size:20
}
},

tooltip:{
mode:"index",
intersect:false
},

zoom:{

pan:{
enabled:true,
mode:"x"
},

zoom:{

wheel:{
enabled:true
},

pinch:{
enabled:true
},

drag:{
enabled:true
},

mode:"x"

}

}

},

interaction:{
mode:"nearest",
intersect:false
},

scales:{

x:{
ticks:{
color:"white"
},
grid:{
color:"#333"
},
title:{
display:true,
text:"Year",
color:"white"
}
},

y:{
ticks:{
color:"white"
},
grid:{
color:"#333"
},
title:{
display:true,
text:"Illustrative Index Value",
color:"white"
}
}

},

animation:{
duration:2000
}

}

});

ctx.style.height="550px";

function resetZoom(){
chart.resetZoom();
}

</script>

</body>
</html>
