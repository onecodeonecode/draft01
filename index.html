<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Search</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    padding:20px;
    text-align:center;
    background:#000;
    border-bottom:1px solid #333;
}

header h1{
    font-size:28px;
}

.search-box{
    padding:20px;
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search-box button{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:#e50914;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.search-box button:hover{
    background:#ff1f2d;
}

.results{
    flex:1;
    padding:15px;
    display:grid;
    gap:15px;
}

.movie-card{
    background:#1c1c1c;
    border-radius:16px;
    overflow:hidden;
    display:flex;
    gap:15px;
    padding:15px;
}

.poster{
    width:100px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    background:#333;
}

.info{
    flex:1;
}

.info h2{
    font-size:18px;
    margin-bottom:8px;
}

.info p{
    color:#ccc;
    margin-bottom:6px;
    font-size:14px;
    line-height:1.4;
}

.loading,
.error{
    text-align:center;
    padding:40px;
    color:#bbb;
}

footer{
    padding:15px;
    text-align:center;
    background:#000;
    border-top:1px solid #333;
    font-size:14px;
}

@media (max-width:480px){

    header h1{
        font-size:24px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        width:100%;
    }

    .movie-card{
        flex-direction:column;
        align-items:center;
        text-align:center;
    }

    .poster{
        width:150px;
        height:225px;
    }
}
</style>
</head>
<body>

<header>
    <h1>🎬 Movie Search</h1>
</header>

<div class="search-box">
    <input
        type="text"
        id="searchInput"
        placeholder="Search for a movie..."
    >
    <button id="searchBtn">
        Search
    </button>
</div>

<div class="results" id="results">
    <div class="loading">
        Search for a movie above.
    </div>
</div>

<footer>
