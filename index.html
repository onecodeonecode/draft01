<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>StepFit Pedometer</title>

<style>
:root {
    --bg: #eef3f8;
    --card: #ffffff;
    --text: #172033;
    --muted: #718096;
    --primary: #2563eb;
    --secondary: #06b6d4;
    --success: #22c55e;
    --danger: #ef4444;
    --border: #e5eaf0;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #dbe4ee;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.app {
    width: min(100vw, 480px);
    min-height: 100vh;
    background: var(--bg);
    overflow-x: hidden;
    position: relative;
}

/* HEADER */

.header {
    padding: 22px 20px 18px;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    color: white;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 25px rgba(37, 99, 235, .22);
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    font-size: 23px;
    font-weight: 800;
}

.date {
    margin-top: 6px;
    font-size: 13px;
    opacity: .88;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

/* MAIN */

.main {
    padding: 18px;
    padding-bottom: 110px;
}

/* STEP CARD */

.step-card {
    background: var(--card);
    border-radius: 26px;
    padding: 22px 18px;
    box-shadow: 0 8px 25px rgba(20, 40, 70, .08);
    text-align: center;
}

.progress {
    width: 205px;
    height: 205px;
    border-radius: 50%;
    margin: 0 auto 16px;
    background:
        conic-gradient(
            var(--primary) var(--progress, 0%),
            #e8eef5 var(--progress, 0%)
        );
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.progress::after {
    content: "";
    position: absolute;
    width: 167px;
    height: 167px;
    border-radius: 50%;
    background: var(--card);
}

.step-content {
    position: relative;
    z-index: 2;
}

.step-icon {
    font-size: 30px;
}

.steps {
    font-size: 42px;
    font-weight: 900;
    line-height: 1;
    margin-top: 5px;
}

.step-label {
    color: var(--muted);
    font-size: 14px;
    margin-top: 7px;
}

.goal-text {
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
}

.goal-text strong {
    color: var(--text);
}

/* CONTROLS */

.controls {
    display: flex;
    gap: 10px;
    margin-top: 17px;
}

.btn {
    flex: 1;
    padding: 14px 10px;
    border: none;
    border-radius: 15px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.start {
    background: var(--primary);
    color: white;
}

.test {
    background: #e9f1ff;
    color: var(--primary);
}

.reset {
    background: #fff0f0;
    color: var(--danger);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
}

.stat {
    background: var(--card);
    border-radius: 18px;
    padding: 17px;
    box-shadow: 0 5px 18px rgba(20, 40, 70, .06);
}

.stat-icon {
    font-size: 23px;
}

.stat-value {
    margin-top: 8px;
    font-size: 21px;
    font-weight: 800;
}

.stat-label {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
}

/* GOAL */

.section-title {
    margin: 24px 3px 10px;
    font-size: 18px;
    font-weight: 800;
}

.goal-card {
    background: var(--card);
    border-radius: 18px;
    padding: 17px;
    box-shadow: 0 5px 18px rgba(20, 40, 70, .06);
}

.goal-row {
    display: flex;
    gap: 10px;
}

.goal-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 16px;
    background: var(--bg);
    color: var(--text);
}

.save-goal {
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    background: var(--primary);
    color: white;
    font-weight: 700;
    cursor: pointer;
}

/* HISTORY */

.history-card {
    background: var(--card);
    border-radius: 18px;
    padding: 17px;
    box-shadow: 0 5px 18px rgba(20, 40, 70, .06);
}

.history-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
}

.history-row:last-child {
    margin-bottom: 0;
}

.history-day {
    width: 48px;
    font-size: 12px;
    font-weight: 700;
}

.history-bar-bg {
    flex: 1;
    height: 10px;
    background: #e9eef4;
    border-radius: 20px;
    overflow: hidden;
}

.history-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    border-radius: 20px;
}

.history-value {
    width: 55px;
    text-align: right;
    font-size: 11px;
    font-weight: 700;
}

/* STATUS */

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 14px;
    background: #eaf7ef;
    color: #15803d;
    font-size: 12px;
    text-align: center;
    font-weight: 700;
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    bottom: 0;
    width: min(100vw, 480px);
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
    z-index: 20;
}

.nav-item {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
}

.nav-item.active {
    color: var(--primary);
    font-weight: 800;
}

.nav-icon {
    font-size: 21px;
    margin-bottom: 2px;
}

/* DARK MODE */

.dark {
    --bg: #101827;
    --card: #182234;
    --text: #f1f5f9;
    --muted: #9aa8bb;
    --border: #26344a;
}

.dark .test {
    background: #203452;
}

.dark .reset {
    background: #3a2226;
}

.dark .history-bar-bg {
    background: #263449;
}

/* RESPONSIVE */

@media (max-height: 700px) {
    .progress {
        width: 175px;
        height: 175px;
    }

    .progress::after {
        width: 143px;
        height: 143px;
    }

    .steps {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="header-row">
            <div>
                <div class="brand">👟 StepFit</div>
                <div class="date" id="todayDate"></div>
            </div>

            <button class="icon-btn" id="themeBtn">🌙</button>
        </div>
    </header>

    <main class="main">

        <section class="step-card">

            <div class="progress" id="progressCircle">
                <div class="step-content">
                    <div class="step-icon">👣</div>
                    <div class="steps" id="stepCount">0</div>
                    <div class="step-label">STEPS TODAY</div>
                </div>
            </div>

            <div class="goal-text">
                Daily Goal:
                <strong id="goalDisplay">10,000</strong>
                steps
            </div>

            <div class="controls">
                <button class="btn start" id="startBtn">
                    ▶ Start
                </button>

                <button class="btn test" id="addBtn">
                    +1 Step
                </button>

                <button class="btn reset" id="resetBtn">
                    Reset
                </button>
            </div>

            <div class="status" id="status">
                Ready to track your steps
            </div>

        </section>


        <section class="stats">

            <div class="stat">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="calories">0</div>
                <div class="stat-label">Calories</div>
            </div>

            <div class="stat">
                <div class="stat-icon">📏</div>
                <div class="stat-value" id="distance">0.00 km</div>
                <div class="stat-label">Distance</div>
            </div>

            <div class="stat">
                <div class="stat-icon">⏱️</div>
                <div class="stat-value" id="activeTime">0 min</div>
                <div class="stat-label">Active Time</div>
            </div>

            <div class="stat">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="percentage">0%</div>
                <div class="stat-label">Goal Complete</div>
            </div>

        </section>


        <div class="section-title">🎯 Daily Goal</div>

        <section class="goal-card">
            <div class="goal-row">
                <input
                    class="goal-input"
                    id="goalInput"
                    type="number"
                    min="100"
                    step="100"
                    value="10000"
                >

                <button class="save-goal" id="saveGoal">
                    Save
                </button>
            </div>
        </section>


        <div class="section-title">📊 7-Day History</div>

        <section class="history-card" id="history">
        </section>

    </main>


    <nav class="bottom-nav">

        <div class="nav-item active">
            <div class="nav-icon">👟</div>
            Today
        </div>

        <div class="nav-item" id="historyNav">
            <div class="nav-icon">📊</div>
            History
        </div>

        <div class="nav-item" id="goalNav">
            <div class="nav-icon">🎯</div>
            Goal
        </div>

    </nav>

</div>


<script>

/* ==========================================
   STEP FIT PEDOMETER
   ========================================== */

const STORAGE_KEY = "stepfit_pedometer_data";

let data = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || {
    goal: 10000,
    days: {},
    theme: "light"
};

let running = false;
let motionHandler = null;

let lastMagnitude = null;
let lastStepTime = 0;

let activeSeconds = 0;
let activeTimer = null;


/* ---------- DATE ---------- */

function getDateKey(date = new Date()) {

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


function getToday() {

    const key = getDateKey();

    if (!data.days[key]) {
        data.days[key] = {
            steps: 0,
            activeSeconds: 0
        };
    }

    return data.days[key];
}


/* ---------- SAVE ---------- */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );
}


/* ---------- UI ---------- */

function updateUI() {

    const today = getToday();

    const steps = today.steps;
    const goal = data.goal;

    const percent = Math.min(
        100,
        Math.round((steps / goal) * 100)
    );

    document.getElementById("stepCount").textContent =
        steps.toLocaleString();

    document.getElementById("goalDisplay").textContent =
        goal.toLocaleString();

    document.getElementById("goalInput").value =
        goal;

    document.getElementById("percentage").textContent =
        percent + "%";

    document.getElementById("progressCircle")
        .style.setProperty(
            "--progress",
            percent + "%"
        );

    /* Approximate calculations */

    const calories =
        Math.round(steps * 0.04);

    const distance =
        steps * 0.00075;

    document.getElementById("calories").textContent =
        calories.toLocaleString();

    document.getElementById("distance").textContent =
        distance.toFixed(2) + " km";

    const minutes =
        Math.floor(activeSeconds / 60);

    document.getElementById("activeTime").textContent =
        minutes + " min";

    updateHistory();
}


/* ---------- ADD STEP ---------- */

function addStep(amount = 1) {

    const today = getToday();

    today.steps += amount;

    saveData();
    updateUI();

    if (today.steps >= data.goal) {

        document.getElementById("status").textContent =
            "🎉 Daily goal reached! Great job!";

    } else if (running) {

        document.getElementById("status").textContent =
            "👟 Walking detected — keep going!";
    }
}


/* ---------- MOTION DETECTION ---------- */

function handleMotion(event) {

    if (!running) return;

    const acc = event.accelerationIncludingGravity;

    if (!acc) return;

    const x = acc.x || 0;
    const y = acc.y || 0;
    const z = acc.z || 0;

    const magnitude =
        Math.sqrt(
            x*x +
            y*y +
            z*z
        );

    if (lastMagnitude === null) {
        lastMagnitude = magnitude;
        return;
    }

    const difference =
        Math.abs(
            magnitude -
            lastMagnitude
        );

    const now = Date.now();

    /*
       Basic step algorithm.

       A significant change in acceleration
       followed by a cooldown is counted as
       one step.
    */

    if (
        difference > 1.15 &&
        now - lastStepTime > 350
    ) {

        addStep(1);

        lastStepTime = now;
    }

    lastMagnitude = magnitude;
}


/* ---------- START / STOP ---------- */

async function startTracking() {

    if (running) {

        stopTracking();
        return;
    }

    /*
       iOS requires permission for motion sensors.
    */

    if (
        typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function"
    ) {

        try {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {

                document.getElementById("status").textContent =
                    "⚠️ Motion permission was not granted.";

                return;
            }

        } catch (error) {

            document.getElementById("status").textContent =
                "⚠️ Motion sensor permission failed.";

            return;
        }
    }

    running = true;

    lastMagnitude = null;
    lastStepTime = 0;

    motionHandler = handleMotion;

    window.addEventListener(
        "devicemotion",
        motionHandler
    );

    startActiveTimer();

    document.getElementById("startBtn").textContent =
        "⏸ Pause";

    document.getElementById("status").textContent =
        "🟢 Tracking steps...";

}


function stopTracking() {

    running = false;

    if (motionHandler) {

        window.removeEventListener(
            "devicemotion",
            motionHandler
        );

        motionHandler = null;
    }

    stopActiveTimer();

    document.getElementById("startBtn").textContent =
        "▶ Start";

    document.getElementById("status").textContent =
        "⏸ Tracking paused";
}


/* ---------- ACTIVE TIME ---------- */

function startActiveTimer() {

    if (activeTimer) return;

    activeTimer = setInterval(() => {

        if (!running) return;

        activeSeconds++;

        const today = getToday();

        today.activeSeconds =
            activeSeconds;

        saveData();

        updateUI();

    }, 1000);
}


function stopActiveTimer() {

    if (activeTimer) {

        clearInterval(activeTimer);
        activeTimer = null;
    }
}


/* ---------- RESET ---------- */

function resetToday() {

    const confirmReset =
        confirm(
            "Reset today's step count?"
        );

    if (!confirmReset) return;

    data.days[getDateKey()] = {
        steps: 0,
        activeSeconds: 0
    };

    activeSeconds = 0;

    saveData();
    updateUI();

    document.getElementById("status").textContent =
        "Today's steps have been reset.";
}


/* ---------- GOAL ---------- */

function saveGoal() {

    let newGoal =
        parseInt(
            document.getElementById("goalInput").value
        );

    if (
        isNaN(newGoal) ||
        newGoal < 100
    ) {

        alert(
            "Please enter a goal of at least 100 steps."
        );

        return;
    }

    data.goal = newGoal;

    saveData();
    updateUI();

    document.getElementById("status").textContent =
        "🎯 Daily goal updated!";
}


/* ---------- HISTORY ---------- */

function updateHistory() {

    const container =
        document.getElementById("history");

    container.innerHTML = "";

    const today = new Date();

    let records = [];

    for (let i = 6; i >= 0; i--) {

        const date = new Date(today);

        date.setDate(
            today.getDate() - i
        );

        const key =
            getDateKey(date);

        const record =
            data.days[key] || {
                steps: 0
            };

        records.push({
            date,
            steps: record.steps
        });
    }

    const maxSteps =
        Math.max(
            data.goal,
            ...records.map(r => r.steps)
        );

    records.forEach(record => {

        const row =
            document.createElement("div");

        row.className =
            "history-row";

        const day =
            record.date.toLocaleDateString(
                undefined,
                { weekday: "short" }
            );

        const width =
            Math.min(
                100,
                (record.steps / maxSteps) * 100
            );

        row.innerHTML = `
            <div class="history-day">
                ${day}
            </div>

            <div class="history-bar-bg">
                <div
                    class="history-bar"
                    style="width:${width}%">
                </div>
            </div>

            <div class="history-value">
                ${record.steps.toLocaleString()}
            </div>
        `;

        container.appendChild(row);
    });
}


/* ---------- THEME ---------- */

function applyTheme() {

    if (data.theme === "dark") {

        document.body.classList.add("dark");

        document.getElementById("themeBtn")
            .textContent = "☀️";

    } else {

        document.body.classList.remove("dark");

        document.getElementById("themeBtn")
            .textContent = "🌙";
    }
}


function toggleTheme() {

    data.theme =
        data.theme === "dark"
            ? "light"
            : "dark";

    saveData();
    applyTheme();
}


/* ---------- DATE ---------- */

function updateDate() {

    document.getElementById("todayDate")
        .textContent =
        new Date().toLocaleDateString(
            undefined,
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );
}


/* ---------- NAVIGATION ---------- */

document.getElementById("historyNav")
    .addEventListener("click", () => {

        document.getElementById("history")
            .scrollIntoView({
                behavior: "smooth"
            });
    });


document.getElementById("goalNav")
    .addEventListener("click", () => {

        document.getElementById("goalInput")
            .scrollIntoView({
                behavior: "smooth"
            });
    });


/* ---------- EVENTS ---------- */

document.getElementById("startBtn")
    .addEventListener(
        "click",
        startTracking
    );

document.getElementById("addBtn")
    .addEventListener(
        "click",
        () => addStep(1)
    );

document.getElementById("resetBtn")
    .addEventListener(
        "click",
        resetToday
    );

document.getElementById("saveGoal")
    .addEventListener(
        "click",
        saveGoal
    );

document.getElementById("themeBtn")
    .addEventListener(
        "click",
        toggleTheme
    );


/* ---------- INITIALIZE ---------- */

const todayRecord = getToday();

activeSeconds =
    todayRecord.activeSeconds || 0;

applyTheme();
updateDate();
updateUI();

</script>

</body>
</html>
