        // Function to render restaurants onto the DOM
        function renderRestaurants(data) {
            const grid = document.getElementById('restaurantGrid');
            const noResults = document.getElementById('noResults');
            const countDisplay = document.getElementById('countDisplay');
            
            grid.innerHTML = '';
            countDisplay.innerText = `Showing ${data.length} restaurants`;

            if (data.length === 0) {
                noResults.style.display = 'block';
                return;
            } else {
                noResults.style.display = 'none';
            }

            data.forEach((restaurant, index) => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <span class="badge-category">${restaurant.category}</span>
                        <a href="${restaurant.url}" target="_blank" rel="noopener noreferrer" title="Click to visit ${restaurant.name}">
                            <img src="${restaurant.image}" alt="${restaurant.name}" loading="lazy">
                        </a>
                    </div>
                    <div class="card-content">
                        <div class="card-header-flex">
                            <a href="${restaurant.url}" target="_blank" rel="noopener noreferrer" class="restaurant-name">
                                ${index + 1}. ${restaurant.name}
                            </a>
                            <div class="rating">
                                <i class="fa-solid fa-star"></i> ${restaurant.rating}
                            </div>
                        </div>
                        <div class="neighborhood">
                            <i class="fa-solid fa-location-dot"></i> ${restaurant.neighborhood}
                        </div>
                        <p class="description">${restaurant.desc}</p>
                        <div class="card-footer">
                            <a href="${restaurant.url}" target="_blank" rel="noopener noreferrer" class="map-link">
                                View Info / Map <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Live Search Filtering Function
        function filterRestaurants() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = restaurants.filter(r => 
                r.name.toLowerCase().includes(query) || 
                r.category.toLowerCase().includes(query) || 
                r.neighborhood.toLowerCase().includes(query) ||
                r.desc.toLowerCase().includes(query)
            );
            renderRestaurants(filtered);
        }

        // Initial render on load
        window.onload = () => {
            renderRestaurants(restaurants);
        };
    </script>
