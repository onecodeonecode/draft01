<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Advisor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 420px;
      background: #020617;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
      font-size: 16px;
    }
    .price {
      text-align: center;
      font-size: 28px;
      margin: 10px 0;
    }
    .signal {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
      padding: 10px;
      border-radius: 10px;
    }
    .buy { background: #064e3b; color: #6ee7b7; }
    .sell { background: #7f1d1d; color: #fecaca; }
    .hold { background: #1e3a8a; color: #bfdbfe; }
    .stats {
      font-size: 14px;
      margin-top: 15px;
      line-height: 1.6;
    }
    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Crypto Advisor</h1>

    <select id="symbol">
      <option value="btcusdt">Bitcoin (BTC)</option>
      <option value="ethusdt">Ethereum (ETH)</option>
      <option value="solusdt">Solana (SOL)</option>
      <option value="dogeusdt">Dogecoin (DOGE)</option>
    </select>

    <div class="price" id="price">$0.00</div>

    <div class="signal hold" id="signal">HOLD</div>

    <div class="stats" id="stats">
      Waiting for data...
    </div>

    <footer>
      Educational use only · Not financial advice
    </footer>
  </div>

  <script>
    let prices = [];
    let socket;

    function connect(symbol) {
      if (socket) socket.close();
      prices = [];

      socket = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@trade`);

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);

        prices.push(price);
        if (prices.length > 50) prices.shift();

        document.getElementById('price').innerText = `$${price.toFixed(2)}`;
        updateSignal();
      };
    }

    function sma(period) {
      if (prices.length < period) return null;
      const slice = prices.slice(-period);
      const sum = slice.reduce((a, b) => a + b, 0);
      return sum / period;
    }

    function updateSignal() {
      const smaFast = sma(10);
      const smaSlow = sma(30);
      if (!smaFast || !smaSlow) return;

      let signal = 'HOLD';
      let cls = 'hold';

      if (smaFast > smaSlow) {
        signal = 'BUY';
        cls = 'buy';
      } else if (smaFast < smaSlow) {
        signal = 'SELL';
        cls = 'sell';
      }

      const el = document.getElementById('signal');
      el.innerText = signal;
      el.className = `signal ${cls}`;

      document.getElementById('stats').innerText =
        `SMA 10: ${smaFast.toFixed(2)}\nSMA 30: ${smaSlow.toFixed(2)}`;
    }

    document.getElementById('symbol').addEventListener('change', (e) => {
      connect(e.target.value);
    });

    connect(document.getElementById('symbol').value);
  </script>
</body>
</html>
