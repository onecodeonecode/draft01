<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Advisor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .app {
      background: #020617;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 12px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .buy { background: #16a34a; color: white; }
    .sell { background: #dc2626; color: white; }
    .hold { background: #f59e0b; color: black; }
    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }
    .price {
      font-size: 28px;
      font-weight: bold;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Stock Advisor</h1>

    <input id="symbol" placeholder="Enter stock symbol (e.g. AAPL)" />
    <button onclick="getStock()">Get Stock Data</button>

    <div id="output" class="card" style="display:none;">
      <div>Symbol: <span id="outSymbol"></span></div>
      <div class="price">$<span id="outPrice"></span></div>
      <div>Trend: <span id="outTrend"></span></div>

      <button class="buy" onclick="decision('BUY')">Should I Buy?</button>
      <button class="sell" onclick="decision('SELL')">Should I Sell?</button>
      <button class="hold" onclick="decision('HOLD')">Should I Hold?</button>

      <div id="advice" style="margin-top:12px;font-weight:bold;"></div>
    </div>

    <div class="footer">Demo App - Not Financial Advice - 1Code </div>
  </div>

  <script>
    // MOCK real-time price (replace with real API)
    async function getStock() {
      const symbol = document.getElementById('symbol').value.toUpperCase();
      if (!symbol) return alert('Enter a stock symbol');

      // Simulated price & trend
      const price = (Math.random() * 200 + 50).toFixed(2);
      const trend = Math.random() > 0.5 ? 'Bullish 📈' : 'Bearish 📉';

      document.getElementById('outSymbol').innerText = symbol;
      document.getElementById('outPrice').innerText = price;
      document.getElementById('outTrend').innerText = trend;
      document.getElementById('output').style.display = 'block';
      document.getElementById('advice').innerText = '';
    }

    function decision(type) {
      const trend = document.getElementById('outTrend').innerText;
      let message = '';

      if (type === 'BUY') {
        message = trend.includes('Bullish')
          ? '✅ AI Suggests: Buying may be favorable.'
          : '⚠️ AI Suggests: Risky buy, trend is bearish.';
      }

      if (type === 'SELL') {
        message = trend.includes('Bearish')
          ? '✅ AI Suggests: Selling may reduce losses.'
          : '⚠️ AI Suggests: Trend still bullish.';
      }

      if (type === 'HOLD') {
        message = 'ℹ️ AI Suggests: Hold and monitor price movement.';
      }

      document.getElementById('advice').innerText = message;
    }
  </script>
</body>
</html>
