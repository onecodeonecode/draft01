<strong></strong></div>
  </div>

<script>
/*
  Real Alarm — WebAudio synthesized sounds
  - Option B sounds synthesized programmatically.
  - Alarm loops until user presses Stop.
  - Works on desktop and mobile (Start button required to unlock audio in some browsers).
*/

const liveClock = document.getElementById('liveClock');
const liveDate = document.getElementById('liveDate');
const alarmTimeInput = document.getElementById('alarmTime');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const resetBtn = document.getElementById('resetBtn');
const status = document.getElementById('status');
const soundSelect = document.getElementById('soundSelect');
const volumeSlider = document.getElementById('volume');

let alarmTimer = null;
let alarmActive = false;
let alarmTriggered = false;
let audioCtx = null;
let masterGain = null;
let sirenOsc = null;
let sirenLFO = null;

// Update live clock every second (digit-by-digit reliable)
function updateClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const ss = String(now.getSeconds()).padStart(2,'0');
  liveClock.textContent = hh + ':' + mm;
  liveDate.textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 1000);

// Helper: create/start AudioContext on first gesture
function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = parseFloat(volumeSlider.value || 0.9);
    masterGain.connect(audioCtx.destination);
  }
}

// Volume linkage
volumeSlider.addEventListener('input', ()=>{
  if(masterGain) masterGain.gain.setValueAtTime(parseFloat(volumeSlider.value), audioCtx.currentTime);
});

// Sound implementations (all return Promises where relevant)

/* 1) Classic alarm buzzer: short rapid buzzing pulses repeated */
function playBuzzer(duration=2000){
  ensureAudio();
  const now = audioCtx.currentTime;
  const pulseInterval = 0.06; // seconds between pulses
  const pulses = Math.floor(duration / (pulseInterval*1000));
  for(let i=0;i<pulses;i++){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square';
    // buzz pitch starts high then drop slightly per pulse
    osc.frequency.value = 900 - Math.random()*200;
    g.gain.setValueAtTime(0.0001, now + i*pulseInterval);
    g.gain.exponentialRampToValueAtTime(0.4, now + i*pulseInterval + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + i*pulseInterval + 0.045);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now + i*pulseInterval);
    osc.stop(now + i*pulseInterval + 0.05);
  }
  return Promise.resolve();
}

/* 2) Digital watch beep: crisp short beeps */
function playBeep(count=6){
  ensureAudio();
  const now = audioCtx.currentTime;
  for(let i=0;i<count;i++){
    const t = now + i*0.45;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1200;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.7, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t+0.14);
  }
  return Promise.resolve();
}

/* 3) Gentle morning chimes: sequence of bell-like notes (add slight reverb via delay feedback) */
function playChime(){
  ensureAudio();
  const now = audioCtx.currentTime;
  // small delay network for reverb-ish effect
  const delay = audioCtx.createDelay(0.5);
  const fb = audioCtx.createGain();
  fb.gain.value = 0.28;
  delay.delayTime.value = 0.18;
  delay.connect(fb);
  fb.connect(delay);
  delay.connect(masterGain);

  const notes = [880, 660, 990, 770]; // some bell notes
  notes.forEach((freq, idx)=>{
    const t = now + idx * 0.55;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    // short attack + long decay
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.8, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+1.8);
    // mild highpass for clarity
    const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220;
    osc.connect(g); g.connect(hp); hp.connect(masterGain); hp.connect(delay);
    osc.start(t);
    osc.stop(t+2.0);
  });

  // cleanup nodes after few seconds
  setTimeout(()=>{ try{ delay.disconnect(); fb.disconnect(); }catch(e){} }, 3000);
  return Promise.resolve();
}

/* 4) Loud emergency siren: continuous sweeping oscillator */
function startSiren(){
  ensureAudio();
  if(sirenOsc) return;
  sirenOsc = audioCtx.createOscillator();
  sirenOsc.type = 'sine';
  sirenLFO = audioCtx.createOscillator();
  sirenLFO.type = 'sawtooth';
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 350; // sweep depth
  // Connect LFO to control frequency of siren oscillator
  sirenLFO.connect(lfoGain);
  lfoGain.connect(sirenOsc.frequency);
  const g = audioCtx.createGain();
  g.gain.value = 0.6;
  sirenOsc.connect(g); g.connect(masterGain);
  sirenOsc.frequency.value = 600; // base
  sirenOsc.start();
  sirenLFO.frequency.value = 0.6; // cycles per second for sweep speed
  sirenLFO.start();
  // store gain so we can stop neatly
  sirenOsc._gainNode = g;
}
function stopSiren(){
  if(!sirenOsc) return;
  try{
    sirenOsc._gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
    sirenOsc.stop(audioCtx.currentTime + 0.22);
    sirenLFO.stop(audioCtx.currentTime + 0.22);
  }catch(e){}
  sirenOsc = null;
  sirenLFO = null;
}

/* Manage alarm scheduling and trigger behavior */
function scheduleAlarm(){
  if(alarmTimer) clearInterval(alarmTimer);
  alarmTimer = setInterval(checkAlarm, 900); // check less than once per second but frequently
  alarmActive = true;
  stopBtn.disabled = false;
  startBtn.disabled = true;
  updateStatus();
}

function clearAlarmSchedule(){
  if(alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
  alarmActive = false;
  alarmTriggered = false;
  stopBtn.disabled = true;
  startBtn.disabled = false;
  stopSiren();
  updateStatus();
}

function updateStatus(){
  if(alarmTriggered) {
    status.innerHTML = '<strong style="color:var(--danger)">ALARM — Playing</strong>';
  } else if(alarmActive && alarmTimeInput.value){
    status.textContent = 'Alarm set for ' + alarmTimeInput.value;
  } else {
    status.textContent = 'No alarm scheduled.';
  }
}

function parseTimeValue(timeStr){
  // expects "HH:MM" 24-hour
  if(!timeStr) return null;
  const [hh,mm] = timeStr.split(':').map(s=>parseInt(s,10));
  if(Number.isNaN(hh) || Number.isNaN(mm)) return null;
  return { hh, mm };
}

async function triggerAlarmLoop(){
  alarmTriggered = true;
  updateStatus();
  ensureAudio();

  const chosen = soundSelect.value;
  const vol = parseFloat(volumeSlider.value || 0.9);
  if(masterGain) masterGain.gain.setValueAtTime(vol, audioCtx.currentTime);

  // Play until user stops. Use an interval to re-trigger sounds for non-continuous ones
  if(chosen === 'siren'){
    startSiren();
  } else if(chosen === 'buzzer'){
    // play repeated buzzer bursts every 1.2s
    const buzInt = setInterval(()=> { playBuzzer(1600); }, 1200);
    // save reference so stop can clear it
    triggerAlarmLoop._interval = buzInt;
    // start one immediately
    playBuzzer(1600);
  } else if(chosen === 'beep'){
    const beepInt = setInterval(()=> { playBeep(6); }, 2200);
    triggerAlarmLoop._interval = beepInt;
    playBeep(6);
  } else if(chosen === 'chime'){
    // play chime sequence every 3500 ms
    const chInt = setInterval(()=> { playChime(); }, 3800);
    triggerAlarmLoop._interval = chInt;
    playChime();
  }
}

// Stop the alarm sound and clear any intervals
function stopAlarmSound(){
  alarmTriggered = false;
  alarmActive = false;
  updateStatus();
  // clear intervals created by triggerAlarmLoop
  if(triggerAlarmLoop._interval){ clearInterval(triggerAlarmLoop._interval); triggerAlarmLoop._interval = null; }
  stopSiren();
  // small audioctx resume redundancy
  try{ if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){}
}

function checkAlarm(){
  const now = new Date();
  const parsed = parseTimeValue(alarmTimeInput.value);
  if(!parsed) return;
  // match hours and minutes exactly
  if(now.getHours() === parsed.hh && now.getMinutes() === parsed.mm){
    // ensure we only trigger once per minute
    if(!alarmTriggered){
      triggerAlarmLoop();
    }
  }
}

// Button events
startBtn.addEventListener('click', ()=>{
  ensureAudio();
  // resume context on gesture
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  // schedule
  if(!alarmTimeInput.value){
    alert('Please choose an alarm time first.');
    return;
  }
  scheduleAlarm();
  updateStatus();
});

stopBtn.addEventListener('click', ()=>{
  // stop sounds and clear schedule
  stopAlarmSound();
  if(alarmTimer) clearInterval(alarmTimer);
  alarmTimer = null;
  stopBtn.disabled = true;
  startBtn.disabled = false;
  status.textContent = 'Alarm stopped.';
});

resetBtn.addEventListener('click', ()=>{
  alarmTimeInput.value = '';
  if(alarmTimer) clearInterval(alarmTimer);
  if(triggerAlarmLoop._interval){ clearInterval(triggerAlarmLoop._interval); triggerAlarmLoop._interval = null; }
  stopSiren();
  alarmActive = false;
  alarmTriggered = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  status.textContent = 'No alarm scheduled.';
});

// If the page is hidden, some browsers throttle intervals. Using visibilitychange to be safe.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && alarmActive && !alarmTriggered){
    // ensure interval still running
    if(!alarmTimer) scheduleAlarm();
  }
});

// Accessibility: keyboard/emergency quick keys (optional)
window.addEventListener('keydown', (e)=>{
  if(e.key === 's') { startBtn.click(); }
  if(e.key === 'x') { stopBtn.click(); }
  if(e.key === 'r') { resetBtn.click(); }
});

// Initialize UI defaults
(function init(){
  // default alarm time: empty
  alarmTimeInput.value = '';
  stopBtn.disabled = true;
  updateStatus();
})();
</script>
</body>
</html>
