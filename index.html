<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Timer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9f43, #ff6b6b);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 400px;
      height: 100%;
      aspect-ratio: 9 / 16;
      padding: 30px 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-top: 10px;
      text-align: center;
    }

    .input-area {
      margin-top: 20px;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    input[type="number"] {
      width: 70px;
      font-size: 1.2rem;
      padding: 10px;
      border: none;
      border-radius: 12px;
      text-align: center;
      color: #333;
    }

    label {
      font-size: 1rem;
      margin-top: 4px;
      display: block;
      text-align: center;
      color: #fff;
      opacity: 0.9;
    }

    .timer {
      font-size: 4rem;
      font-weight: bold;
      margin-top: 40px;
      letter-spacing: 3px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: auto;
      margin-bottom: 20px;
    }

    button {
      background-color: #fff;
      color: #ff6b6b;
      border: none;
      width: 70%;
      padding: 14px;
      font-size: 1.2rem;
      margin: 8px 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      background-color: #ffeaa7;
      color: #222;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .timer {
        font-size: 3.5rem;
      }
      input[type="number"] {
        width: 60px;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Kitchen Timer</h1>

    <div class="input-area">
      <div>
        <input type="number" id="hours" placeholder="Hr" min="0" />
        <label for="hours">Hr</label>
      </div>
      <div>
        <input type="number" id="minutes" placeholder="Min" min="0" max="59" />
        <label for="minutes">Min</label>
      </div>
      <div>
        <input type="number" id="seconds" placeholder="Sec" min="0" max="59" />
        <label for="seconds">Sec</label>
      </div>
    </div>

    <div class="timer" id="display">00:00:00</div>

    <div class="controls">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <!-- 🔔 Bell sound -->
  <audio id="bell" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" preload="auto"></audio>

  <script>
    let timer;
    let remainingTime = 0;
    let running = false;

    const display = document.getElementById('display');
    const hoursInput = document.getElementById('hours');
    const minutesInput = document.getElementById('minutes');
    const secondsInput = document.getElementById('seconds');
    const bell = document.getElementById('bell');

    function updateDisplay(time) {
      const hrs = Math.floor(time / 3600);
      const mins = Math.floor((time % 3600) / 60);
      const secs = time % 60;
      display.textContent =
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    document.getElementById('start').addEventListener('click', () => {
      if (running) return;

      const hrs = parseInt(hoursInput.value) || 0;
      const mins = parseInt(minutesInput.value) || 0;
      const secs = parseInt(secondsInput.value) || 0;
      if (remainingTime <= 0) remainingTime = hrs * 3600 + mins * 60 + secs;
      if (remainingTime <= 0) return;

      running = true;
      timer = setInterval(() => {
        if (remainingTime > 0) {
          remainingTime--;
          updateDisplay(remainingTime);
        } else {
          clearInterval(timer);
          running = false;
          updateDisplay(0);
          bell.play();
          alert("Time's up! 🍽️");
        }
      }, 1000);
    });

    document.getElementById('stop').addEventListener('click', () => {
      clearInterval(timer);
      running = false;
    });

    document.getElementById('reset').addEventListener('click', () => {
      clearInterval(timer);
      running = false;
      remainingTime = 0;
      display.textContent = '00:00:00';
      hoursInput.value = '';
      minutesInput.value = '';
      secondsInput.value = '';
    });
  </script>
</body>
</html>
